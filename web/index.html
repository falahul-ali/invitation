<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="You are cordially invited to the Waleema Ceremony of Falahul Ali &amp; Fathima Ihshana — Sunday, 7th June 2026 at Ilma Reception Hall, Mawanella.">

  <!-- Open Graph / WhatsApp / Facebook link preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://falahul-ali.github.io/">
  <meta property="og:title" content="🤍💍 Falahul Ali &amp; Fathima Ihshana — Waleema Invitation">
  <meta property="og:description" content="بَارَكَ اللَّهُ لَكُمَا ✨&#10;&#10;Falahul Ali &amp; Fathima Ihshana&#10;joyfully invite you to their Waleema Ceremony&#10;&#10;📅 Sunday, 7th June 2026&#10;🕌 Ilma Reception Hall, Mawanella&#10;&#10;May Allah bless this union with love, mercy &amp; barakah. 🤍">
  <meta property="og:image" content="https://falahul-ali.github.io/logo.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Falahul Ali &amp; Fathima Ihshana Wedding Invitation">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🤍💍 Falahul Ali &amp; Fathima Ihshana — Waleema Invitation">
  <meta name="twitter:description" content="بَارَكَ اللَّهُ لَكُمَا ✨&#10;&#10;Falahul Ali &amp; Fathima Ihshana&#10;joyfully invite you to their Waleema Ceremony&#10;&#10;📅 Sunday, 7th June 2026&#10;🕌 Ilma Reception Hall, Mawanella&#10;&#10;May Allah bless this union with love, mercy &amp; barakah. 🤍">
  <meta name="twitter:image" content="https://falahul-ali.github.io/logo.png">
  
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ali-Ihshana Wedding">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>🤍💍 Ali &amp; Ihshana — Waleema Invitation | 7th June 2026</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Loading screen shown immediately while Flutter engine boots.
       Removed automatically on the first Flutter frame via the
       'flutter-first-frame' event. -->
  <div id="loading-screen" style="
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #0d1b2a 0%, #1a2e45 60%, #0d1b2a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: Georgia, serif;
  ">
    <!-- Logo / monogram -->
    <div style="
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid rgba(212,175,55,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      animation: pulse-ring 2s ease-in-out infinite;
    ">
      <img src="logo.png" alt="" style="width:60px;height:60px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">
    </div>

    <!-- Names -->
    <div style="
      color: #f9e7b9;
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-align: center;
    ">Falahul Ali &amp; Fathima Ihshana</div>

    <!-- Subtitle -->
    <div style="
      color: rgba(212,175,55,0.75);
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
    ">Wedding Invitation</div>

    <!-- Animated dots -->
    <div style="display:flex;gap:8px;">
      <span style="width:8px;height:8px;border-radius:50%;background:#d4af37;animation:dot-bounce 1.4s ease-in-out infinite 0s;"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#d4af37;animation:dot-bounce 1.4s ease-in-out infinite 0.2s;"></span>
      <span style="width:8px;height:8px;border-radius:50%;background:#d4af37;animation:dot-bounce 1.4s ease-in-out infinite 0.4s;"></span>
    </div>
  </div>

  <style>
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,175,55,0.3); }
      50%       { box-shadow: 0 0 0 12px rgba(212,175,55,0); }
    }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1.0); opacity: 1.0; }
    }
    /* Smooth fade-out when Flutter is ready */
    #loading-screen.fade-out {
      transition: opacity 0.5s ease;
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove the loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function () { el.remove(); }, 500);
      }
    });
  </script>
</body>
</html>
